<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cgtracker-dark-title cgtracker-dark-desc">
<title id="cgtracker-dark-title">Pilot Training Tracker data flow</title>
<desc id="cgtracker-dark-desc">Three CSV exports feed one consolidation macro, which grades every currency against its own interval and writes a single colour-coded dashboard sheet.</desc>
