<text x="64" y="44" fill="#1d1d1f" font-size="22" font-weight="500" font-family="Roboto,system-ui,sans-serif">ROUGE on DialogSum, 500 dialogues</text>
<text x="64" y="70" fill="#3c3c41" font-size="13" font-family="Roboto,system-ui,sans-serif">Three models, not two. The bar that ships is the 4-bit one.</text>
