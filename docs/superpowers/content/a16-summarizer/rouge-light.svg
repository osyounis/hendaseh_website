<title id="rouge-light-t">ROUGE scores across three models</title>
<desc id="rouge-light-d">Grouped bars comparing ROUGE-1, ROUGE-2 and ROUGE-L for the base Qwen2.5-1.5B model, the fp16 QLoRA fine-tune, and the 4-bit MLX model that ships on the phone. The fine-tune gains roughly 16 to 19 points over base on every metric; quantizing to 4-bit gives back about 1.5 to 2 points.</desc>
