name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Prevent runaway jobs from burning minutes
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Re-enabled 2026-08-29. The TODO this replaced ("after ESLint config
      # migration") was satisfied when the config moved to eslint-config-next@16's
      # native flat configs in eslint.config.mjs; the line stayed commented out
      # for a while after that, so CI ran unit, e2e and build but never lint.
      - name: Run linter
        run: npm run lint

      # An intake draft carries TODO-OMAR in every slot needing judgement.
      # This is the gate that stops one merging half-filled.
      - name: Reject unfilled intake placeholders
        run: npm run intake -- --check

      - name: Run unit tests
        run: npm run test:run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
